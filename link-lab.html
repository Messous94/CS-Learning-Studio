<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طبقة ربط البيانات | Computer Networks Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f5;color:#153039;font:1rem/1.7 system-ui}main{max-width:50rem;margin:auto;padding:1.4rem}section{background:white;padding:1.2rem;border-radius:12px;margin:1rem 0}label{display:block;margin:.4rem 0}select,input,button{font:inherit;padding:.35rem;max-width:100%}button{margin:.25rem}dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem}dd{margin:0;overflow-wrap:anywhere}a{color:#125660}</style></head><body><main><nav><a id="back" href="network.html">رحلة حزمة</a></nav><h1>مختبر طبقة ربط البيانات</h1><label>التجربة <select id="mode"><option value="encoding">ترميز الإشارة وكشف الخطأ</option><option value="access">مشاركة وسيط النقل</option></select></label>
<section id="encoding"><h2>من البتات إلى الإشارة</h2><label>بتات البيانات (1 إلى 16) <input id="bits" dir="ltr" value="1010" maxlength="16"></label><label>ترميز الخط <select id="coding"><option>NRZ-L</option><option>Manchester</option></select></label><label>خطأ أثناء النقل <select id="error"><option value="0">نقل سليم</option><option value="1">اقلب أول بت</option><option value="2">اقلب أول بتين</option></select></label><p>نضيف بت تكافؤ زوجي قبل الإرسال. في رسم Manchester هنا يصعد الصفر في منتصف البت ويهبط الواحد.</p><pre dir="ltr" id="wave" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p id="check" role="status"></p></section>
<section id="access" hidden><h2>جهازان جاهزان للإرسال</h2><label>نوع الوصلة <select id="medium"><option value="hub">Ethernet مشترك نصف مزدوج</option><option value="switch">Ethernet بمبدّل ووصلات كاملة الازدواج</option><option value="wifi">Wi-Fi بقناة مشتركة</option></select></label><label>توقيت المحاولة <select id="timing"><option value="same">في نفس اللحظة</option><option value="apart">بعد انتهاء إرسال الجهاز الأول</option></select></label><p id="note"></p><button id="step">الخطوة التالية</button> <button id="reset">من البداية</button><ol id="trace"></ol></section></main><script type="module" src="link-lab.mjs"></script></body></html>
